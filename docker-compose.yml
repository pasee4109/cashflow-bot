services:
  backend:
    build: ./backend
    container_name: cashflow-backend
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-long-random-string-please}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # When running behind the frontend's nginx, the browser-visible callback
      # is on the frontend origin (which proxies /api to this service).
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-http://localhost:8080/api/auth/google/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - ALLOW_DEV_LOGIN=${ALLOW_DEV_LOGIN:-true}
      - DATABASE_URL=sqlite:////app/data/app.db
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: cashflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  backend-data:
