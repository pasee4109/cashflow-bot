version: "3.9"

services:
  cashflow-ladder:
    build: .
    container_name: cashflow-ladder-bot
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - bot-data:/app/data
      - ./state.db:/app/state.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bot-data:
